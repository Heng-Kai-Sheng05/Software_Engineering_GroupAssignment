<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Rooms — Hotel Quest</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-mark">C</span>
                <span class="logo-text">Hotel Quest</span>
            </a>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="rooms.html" class="active">Rooms</a></li>
                <li><a href="my-bookings.html">My Bookings</a></li>
            </ul>
            <div class="nav-auth">
                <button class="btn-ghost" id="loginBtn">Sign In</button>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <span class="section-tag">— Accommodations</span>
            <h1>Rooms & <em>suites</em></h1>
            <p>Choose from our curated collection of 146 elegantly designed rooms</p>
        </div>
    </header>

    <section class="quick-search">
        <div class="container">
            <div class="search-card">
                <h3>Reserve Your Stay</h3>
                <form id="quickSearchForm" class="search-form">
                    <div class="form-group">
                        <label>Check-In</label>
                        <div class="date-input">
                            <input type="text" id="checkIn" placeholder="YYYY-MM-DD" required>
                            <button type="button" class="date-toggle" aria-label="Open calendar">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"></rect>
                                    <path d="M16 3v4M8 3v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Check-Out</label>
                        <div class="date-input">
                            <input type="text" id="checkOut" placeholder="YYYY-MM-DD" required>
                            <button type="button" class="date-toggle" aria-label="Open calendar">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"></rect>
                                    <path d="M16 3v4M8 3v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Adults</label>
                        <input type="number" id="adults" min="0" max="8" value="1" required>
                    </div>
                    <div class="form-group">
                        <label>Children</label>
                        <input type="number" id="children" min="0" max="4" value="0" required>
                    </div>
                    <button type="submit" class="btn-primary btn-search">CHECK AVAILABILITY</button>
                </form>
            </div>
        </div>
    </section>

    <section class="rooms-preview" style="background: var(--color-bg); padding: 4rem 0 8rem;">
        <div class="container">
            <div id="resultsMeta" class="results-meta"></div>
            <div class="rooms-grid" id="roomsContainer"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding: 0;">
                <p>© 2026 Hotel Quest. Academic Project — BCS2073 Software Engineering, QIU.</p>
            </div>
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/user-module.js"></script>
    <script src="../js/room-module.js"></script>
    <script src="../js/datepicker.js"></script>
    <script src="../js/auth-ui.js"></script>
    <script>
        // Fix paths for nested pages
        const original = RoomModule.createRoomCard;
        RoomModule.createRoomCard = function(room) {
            return original(room).replace(/pages\//g, '');
        };

        const toLocalISO = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const today = new Date();
        const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
        const dayAfter = new Date(today); dayAfter.setDate(today.getDate() + 2);

        const saved = sessionStorage.getItem('searchCriteria');
        const criteria = saved ? JSON.parse(saved) : {};
        const checkInIso = criteria.checkIn || toLocalISO(tomorrow);
        const checkOutIso = criteria.checkOut || toLocalISO(dayAfter);
        const checkInEl = document.getElementById('checkIn');
        const checkOutEl = document.getElementById('checkOut');
        checkInEl.value = checkInIso;
        checkOutEl.value = checkOutIso;
        checkInEl.dataset.iso = checkInIso;
        checkOutEl.dataset.iso = checkOutIso;
        if (criteria.adults != null) document.getElementById('adults').value = criteria.adults;
        else if (criteria.guests) document.getElementById('adults').value = criteria.guests;
        if (criteria.children != null) document.getElementById('children').value = criteria.children;

        function getCurrentCriteria() {
            const adults = parseInt(document.getElementById('adults').value, 10) || 0;
            const children = parseInt(document.getElementById('children').value, 10) || 0;
            const checkInEl = document.getElementById('checkIn');
            const checkOutEl = document.getElementById('checkOut');
            return {
                checkIn: checkInEl.dataset.iso || checkInEl.value,
                checkOut: checkOutEl.dataset.iso || checkOutEl.value,
                adults: adults,
                children: children,
                guests: String(Math.max(adults + children, 1))
            };
        }

        function persistSearchCriteria() {
            sessionStorage.setItem('searchCriteria', JSON.stringify(getCurrentCriteria()));
        }

        function applyFilter() {
            persistSearchCriteria();
            const c = getCurrentCriteria();
            const total = c.adults + c.children;
            const rooms = RoomModule.searchRooms({ guests: c.guests });
            const meta = document.getElementById('resultsMeta');
            if (total <= 0) {
                meta.innerHTML = '<strong>Please select at least 1 guest.</strong>';
            } else if (rooms.length === 0) {
                meta.innerHTML = '<strong>No rooms can accommodate ' + total +
                    ' guest' + (total !== 1 ? 's' : '') +
                    '</strong> (' + c.adults + ' adult' + (c.adults !== 1 ? 's' : '') +
                    ', ' + c.children + ' child' + (c.children !== 1 ? 'ren' : '') +
                    '). Try reducing the number of guests.';
            } else {
                meta.innerHTML = '<strong>' + rooms.length + '</strong> room' +
                    (rooms.length !== 1 ? 's' : '') + ' available for <strong>' +
                    total + ' guest' + (total !== 1 ? 's' : '') + '</strong> (' +
                    c.adults + ' adult' + (c.adults !== 1 ? 's' : '') + ', ' +
                    c.children + ' child' + (c.children !== 1 ? 'ren' : '') + ')';
            }
            RoomModule.renderRooms('roomsContainer', rooms);
        }

        applyFilter();

        ['checkIn', 'checkOut', 'adults', 'children'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('change', applyFilter);
            el.addEventListener('input', applyFilter);
        });

        document.getElementById('quickSearchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const c = getCurrentCriteria();
            const dateCheck = RoomModule.validateDates(c.checkIn, c.checkOut);
            if (!dateCheck.valid) {
                alert(dateCheck.message);
                return;
            }
            applyFilter();
            document.getElementById('resultsMeta').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        // Sign In button handled by auth-ui.js
    </script>
</body>
</html>
